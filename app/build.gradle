plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.hof.hoopclock"
    compileSdk 34

    defaultConfig {
        applicationId "com.hof.hoopclock"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // A fixed key so each new build installs over the last one.
    signingConfigs {
        release {
            storeFile file("hoopclock.keystore")
            storePassword "hoopclock"
            keyAlias "hoopclock"
            keyPassword "hoopclock"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress "onnx", "bin"
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
