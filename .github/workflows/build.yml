name: Build TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the Android tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk hoop-clock-tv.apk

      - name: Save as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoop-clock-tv
          path: hoop-clock-tv.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hoop-clock-tv.apk \
            --title "Hoop Clock TV, build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
